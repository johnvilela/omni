name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and release if the version tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version/version.go)
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "tag $version already exists — nothing to release"
            exit 0
          fi
          scripts/build.sh all
          (cd dist && sha256sum omni* > checksums.txt)
          gh release create "$version" dist/* --generate-notes --target "$GITHUB_SHA"
