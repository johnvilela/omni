name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.gate.outputs.version }}
      new: ${{ steps.gate.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: is the version tag new?
        id: gate
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version/version.go)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "tag $version already exists — nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: build and release
        if: steps.gate.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build.sh all
          (cd dist && sha256sum omni* > checksums.txt)
          gh release create "${{ steps.gate.outputs.version }}" dist/* --generate-notes --target "$GITHUB_SHA"

  # the image rides the same gate; its own job so a slow qemu arm64 build never
  # blocks the binary release and can be re-run alone
  docker:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
